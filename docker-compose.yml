services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dayflow
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dayflow"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dayflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dayflow-local-development-secret-change-in-production}
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:3090
      APP_ENV: development
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_API_KEY_FALLBACK: ${GROQ_API_KEY_FALLBACK}
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:-dayflow-local-mcp-token}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcpserver:
    build: ./mcpserver
    ports:
      - "8091:8081"
    environment:
      QUERY_API_BASE: http://backend:8080
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:-dayflow-local-mcp-token}
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8090
    ports:
      - "3090:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
